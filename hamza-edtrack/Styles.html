<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1c2331;
    --muted: #6b7280;
    --primary: #2f6fed;
    --primary-dark: #1f4fbf;
    --border: #e3e6ee;
    --good: #1f9d55;
    --warn: #d97706;
    --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }
  h1 { font-size: 1.35rem; margin: 4px 0 2px; }
  h2 { font-size: 1.05rem; margin: 18px 0 8px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 0;
  }
  .topbar a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  .topbar .brand { gap: 8px; }
  .topbar .brand-mark { width: 24px; height: 24px; }
  .topbar .brand-word { font-size: 0.85rem; font-weight: 700; color: var(--text); letter-spacing: 0.02em; }

  /* Brand lockup (icon + wordmark), used full-size on the home screen */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { flex-shrink: 0; display: block; }
  .brand h1 { margin: 0; line-height: 1.1; }
  .brand .brand-tagline { color: var(--muted); font-size: 0.82rem; margin-top: 1px; }

  /* Wider viewports get a roomier canvas and side-by-side layout instead of
     one long stack of cards — mobile keeps everything single-column. */
  @media (min-width: 860px) {
    .wrap { max-width: 1080px; padding: 24px 32px 56px; }
    .nav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .desktop-grid { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 24px; align-items: start; }
    .desktop-grid > .card:first-child { position: sticky; top: 24px; }
  }

  /* Loading skeletons — shown in place of a dropdown/list while its
     initial data fetch is still pending. */
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, #eef0f6 37%, var(--border) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .loading-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.88rem; padding: 6px 0; }
  .spinner-dark {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .nav-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 1.05rem;
  }
  .nav-card .desc { font-weight: 400; color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .nav-card .arrow { color: var(--primary); font-size: 1.3rem; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin: 12px 0 4px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--text);
  }
  input[type="file"] { width: 100%; padding: 10px 0; }
  .btn {
    display: inline-block;
    width: 100%;
    text-align: center;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 600;
    margin-top: 16px;
    cursor: pointer;
  }
  .btn:active { background: var(--primary-dark); }
  .btn:disabled { background: #a9b6d8; }
  .btn-secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .radio-group { display: flex; gap: 12px; margin: 8px 0; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; margin: 0; }
  .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .pill-good { background: #e6f7ec; color: var(--good); }
  .pill-warn { background: #fef3e2; color: var(--warn); }
  .pill-bad { background: #fdeaea; color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; margin-top: 10px; }
  .status-error { background: #fdeaea; color: var(--bad); }
  .status-ok { background: #e6f7ec; color: var(--good); }
  .thumb-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumb-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  a.doc-link {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--primary);
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
    margin-top: 8px;
  }
</style>
