<?!= include('Styles'); ?>
<div class="wrap">
  <div class="topbar"><a href="<?= getWebAppUrl_() ?>" target="_top">‹ Home</a></div>
  <h1>Generate Paper</h1>
  <div class="subtitle">Samples the question bank into a fresh paper + answer key.</div>

  <div class="card">
    <label for="subject">Subject</label>
    <select id="subject"></select>

    <label for="term">Term</label>
    <input type="text" id="term" value="Term 1" />

    <label for="totalMarks">Total Marks</label>
    <input type="number" id="totalMarks" value="60" min="10" step="1" />

    <label for="paperCount">How many papers</label>
    <input type="number" id="paperCount" value="1" min="1" max="10" />
    <div class="muted" style="margin-top:2px;">Generates that many independent practice papers in one go (e.g. for repeat practice).</div>

    <label>Strand Mix</label>
    <div class="radio-group">
      <label><input type="radio" name="mode" value="auto" checked /> Auto (syllabus weight)</label>
      <label><input type="radio" name="mode" value="manual" /> Manual</label>
    </div>

    <div id="manualStrands" style="display:none;"></div>

    <button class="btn" id="generateBtn" onclick="submitGenerate()">Generate Paper</button>
    <div id="status"></div>
  </div>

  <div id="result" style="display:none;">
    <h2>Paper(s) ready</h2>
    <div id="resultList"></div>
  </div>

  <h2>Previously Generated Papers</h2>
  <div class="card">
    <div id="pastPapersEmpty" class="muted" style="display:none;">No papers generated yet.</div>
    <table id="pastPapersTable" style="display:none;">
      <thead><tr><th>Paper</th><th>Marks</th><th>Links</th></tr></thead>
      <tbody id="pastPapersBody"></tbody>
    </table>
  </div>
</div>

<script>
  var strandCache = {};
  var studentName = 'Hamza';

  function loadSubjects() {
    google.script.run
      .withSuccessHandler(function (subjects) {
        var sel = document.getElementById('subject');
        sel.innerHTML = subjects.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
        loadStrands();
      })
      .withFailureHandler(showError)
      .getAvailableSubjects();
  }

  function loadStrands() {
    var subject = document.getElementById('subject').value;
    if (strandCache[subject]) { renderManualStrands(strandCache[subject]); return; }
    google.script.run
      .withSuccessHandler(function (strands) {
        strandCache[subject] = strands;
        renderManualStrands(strands);
      })
      .withFailureHandler(showError)
      .getStrandsForSubject(subject);
  }

  function renderManualStrands(strands) {
    var container = document.getElementById('manualStrands');
    container.innerHTML = strands.map(function (s) {
      return '<label>' + s.strand + '</label>' +
        '<input type="number" class="strand-input" data-strand="' + s.strand + '" value="' + s.defaultWeight + '" min="0" step="1" onInput="updateManualTotal()" />';
    }).join('') + '<div id="manualTotal" class="muted" style="margin-top:6px;"></div>';
    updateManualTotal();
  }

  function updateManualTotal() {
    var inputs = document.querySelectorAll('.strand-input');
    var sum = 0;
    inputs.forEach(function (i) { sum += Number(i.value) || 0; });
    var totalMarks = Number(document.getElementById('totalMarks').value) || 0;
    var el = document.getElementById('manualTotal');
    if (!el) return;
    el.textContent = 'Strand total: ' + sum + ' / ' + totalMarks + ' marks';
    el.style.color = sum === totalMarks ? '#1f9d55' : '#d97706';
  }

  function loadPastPapers() {
    google.script.run
      .withSuccessHandler(renderPastPapers)
      .withFailureHandler(showError)
      .listPapers();
  }

  function renderPastPapers(papers) {
    document.getElementById('pastPapersEmpty').style.display = papers.length ? 'none' : 'block';
    document.getElementById('pastPapersTable').style.display = papers.length ? 'table' : 'none';
    document.getElementById('pastPapersBody').innerHTML = papers.map(function (p) {
      var waText = encodeURIComponent('Hi ' + studentName + '! Here is your ' + p.subject + ' ' + p.term + ' paper (' + p.total_marks + ' marks): ' + p.doc_url_paper);
      return '<tr>' +
        '<td>' + p.paper_id + '<div class="muted">' + p.subject + ' · ' + p.term + ' · ' + p.created_date + '</div></td>' +
        '<td>' + p.total_marks + '</td>' +
        '<td>' +
          '<a href="' + p.doc_url_paper + '" target="_blank">Paper</a> · ' +
          '<a href="' + p.doc_url_key + '" target="_blank">Key</a> · ' +
          '<a href="https://wa.me/?text=' + waText + '" target="_blank">Share</a>' +
        '</td>' +
        '</tr>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadSubjects();
    loadPastPapers();
    google.script.run.withSuccessHandler(function (name) { studentName = name || 'Hamza'; }).withFailureHandler(function () {}).getStudentName();
    document.getElementById('subject').addEventListener('change', loadStrands);
    document.getElementById('totalMarks').addEventListener('input', updateManualTotal);
    document.querySelectorAll('input[name="mode"]').forEach(function (r) {
      r.addEventListener('change', function () {
        document.getElementById('manualStrands').style.display = this.value === 'manual' ? 'block' : 'none';
      });
    });
  });

  function submitGenerate() {
    var subject = document.getElementById('subject').value;
    var term = document.getElementById('term').value || 'Term 1';
    var totalMarks = Number(document.getElementById('totalMarks').value) || 60;
    var paperCount = Number(document.getElementById('paperCount').value) || 1;
    var mode = document.querySelector('input[name="mode"]:checked').value;

    var config = { subject: subject, term: term, totalMarks: totalMarks, mode: mode };
    if (mode === 'manual') {
      var targets = {};
      document.querySelectorAll('.strand-input').forEach(function (i) { targets[i.dataset.strand] = Number(i.value) || 0; });
      config.strandTargets = targets;
    }

    var btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Generating…';
    document.getElementById('status').innerHTML = '';

    google.script.run
      .withSuccessHandler(function (res) { onGenerateSuccess(res); resetBtn(); loadPastPapers(); })
      .withFailureHandler(function (err) { showError(err); resetBtn(); })
      .generatePaperBatch(config, paperCount);
  }

  function resetBtn() {
    var btn = document.getElementById('generateBtn');
    btn.disabled = false;
    btn.textContent = 'Generate Paper';
  }

  function showError(err) {
    document.getElementById('status').innerHTML = '<div class="status status-error">' + (err.message || err) + '</div>';
  }

  function onGenerateSuccess(batch) {
    document.getElementById('result').style.display = 'block';
    document.getElementById('resultList').innerHTML = batch.papers.map(function (res) {
      return '<div class="card">' +
        '<div class="muted">' + res.paperId + ' · ' + res.subject + ' · ' + res.term + ' · ' + res.totalMarks + ' marks</div>' +
        '<a class="doc-link" href="' + res.docUrlPaper + '" target="_blank">Open Paper</a>' +
        '<a class="doc-link" href="' + res.docUrlKey + '" target="_blank">Open Answer Key</a>' +
        '<table style="margin-top:14px;">' +
          '<thead><tr><th>Strand</th><th>Target</th><th>Achieved</th><th>Qs</th></tr></thead>' +
          '<tbody>' + res.strandBreakdown.map(function (s) {
            return '<tr><td>' + s.strand + '</td><td>' + s.target + '</td><td>' + s.achieved + '</td><td>' + s.count + '</td></tr>';
          }).join('') + '</tbody>' +
        '</table>' +
        '</div>';
    }).join('');
    if (batch.errors && batch.errors.length) {
      document.getElementById('resultList').innerHTML += '<div class="status status-error">Stopped after ' +
        batch.papers.length + ' paper(s): ' + batch.errors[0].message + '</div>';
    }
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
  }
</script>
