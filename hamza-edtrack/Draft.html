<?!= include('Styles'); ?>
<div class="wrap">
  <div class="topbar">
    <a href="<?= getWebAppUrl_() ?>" target="_top">‹ Home</a>
    <a class="brand" href="<?= getWebAppUrl_() ?>" target="_top" style="text-decoration:none;">
      <?!= include('BrandMark'); ?>
      <span class="brand-word">TG4P</span>
    </a>
  </div>
  <h1>Draft Questions</h1>
  <div class="subtitle">AI-drafted from the Term 1 syllabus topics. Review and edit before saving — nothing is added to the bank until you save it.</div>

  <div class="desktop-grid">
    <div class="card">
      <div id="loadingLine" class="loading-line"><span class="spinner-dark"></span>Loading subjects…</div>
      <div id="formFields" style="display:none;">
        <label for="subject">Subject</label>
        <select id="subject"></select>

        <label>Mode</label>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="strand" checked /> One strand</label>
          <label><input type="radio" name="mode" value="auto" /> Auto-fill by weightage</label>
        </div>

        <div id="strandModeFields">
          <label for="strand">Strand</label>
          <select id="strand"></select>
          <div id="topicsHint" class="muted" style="margin-top:4px;"></div>
          <label for="count">How many</label>
          <input type="number" id="count" value="5" min="1" max="15" />
        </div>

        <div id="autoModeFields" style="display:none;">
          <label for="autoCount">Total questions to draft</label>
          <input type="number" id="autoCount" value="20" min="4" max="60" />
          <div class="muted" style="margin-top:2px;">Split across every strand in proportion to its syllabus weight — the same weighting Generate Paper uses.</div>
        </div>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="1">1 — warm-up</option>
          <option value="2" selected>2 — standard</option>
          <option value="3">3 — multi-step</option>
        </select>

        <label for="additionalInstructions">Additional instructions (optional)</label>
        <textarea id="additionalInstructions" rows="2" placeholder="e.g. Focus on word problems, avoid negative numbers, make questions about cricket..."></textarea>

        <button class="btn" id="draftBtn" onclick="submitDraft()">Draft Questions</button>
        <div id="status"></div>
      </div>
    </div>

    <div id="reviewCard" style="display:none;">
      <h2>Review before saving</h2>
      <div id="reviewErrors"></div>
      <div id="reviewList"></div>
      <div class="card">
        <button class="btn" id="saveBtn" onclick="saveSelected()">Save Selected to Question Bank</button>
        <div id="saveStatus"></div>
      </div>
    </div>
  </div>
</div>

<script>
  var strandCache = {};
  var drafted = [];

  function loadSubjects() {
    google.script.run
      .withSuccessHandler(function (subjects) {
        subjects = subjects || [];
        var sel = document.getElementById('subject');
        sel.innerHTML = subjects.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
        loadStrands();
        document.getElementById('loadingLine').style.display = 'none';
        document.getElementById('formFields').style.display = 'block';
      })
      .withFailureHandler(showError)
      .getAvailableSubjects();
  }

  function loadStrands() {
    var subject = document.getElementById('subject').value;
    if (strandCache[subject]) { renderStrands(strandCache[subject]); return; }
    google.script.run
      .withSuccessHandler(function (strands) {
        strands = strands || [];
        strandCache[subject] = strands;
        renderStrands(strands);
      })
      .withFailureHandler(showError)
      .getStrandsForSubject(subject);
  }

  function renderStrands(strands) {
    strands = strands || [];
    var sel = document.getElementById('strand');
    sel.innerHTML = strands.map(function (s) { return '<option value="' + s.strand + '">' + s.strand + '</option>'; }).join('');
    loadTopicsHint();
  }

  function loadTopicsHint() {
    var subject = document.getElementById('subject').value;
    var strand = document.getElementById('strand').value;
    google.script.run
      .withSuccessHandler(function (topics) {
        topics = topics || [];
        document.getElementById('topicsHint').textContent = topics.length ? 'Topics: ' + topics.join(' · ') : '';
      })
      .withFailureHandler(showError)
      .getSyllabusTopics(subject, strand);
  }

  function currentMode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  function toggleMode() {
    var isAuto = currentMode() === 'auto';
    document.getElementById('strandModeFields').style.display = isAuto ? 'none' : 'block';
    document.getElementById('autoModeFields').style.display = isAuto ? 'block' : 'none';
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadSubjects();
    document.getElementById('subject').addEventListener('change', loadStrands);
    document.getElementById('strand').addEventListener('change', loadTopicsHint);
    document.querySelectorAll('input[name="mode"]').forEach(function (r) { r.addEventListener('change', toggleMode); });
  });

  function submitDraft() {
    var subject = document.getElementById('subject').value;
    var difficulty = Number(document.getElementById('difficulty').value) || 2;
    var additionalInstructions = document.getElementById('additionalInstructions').value.trim();
    var mode = currentMode();

    var btn = document.getElementById('draftBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Drafting…';
    document.getElementById('status').innerHTML = '';

    if (mode === 'auto') {
      var totalCount = Number(document.getElementById('autoCount').value) || 20;
      google.script.run
        .withSuccessHandler(function (res) { onAutoDrafted(subject, res); resetBtn(); })
        .withFailureHandler(function (err) { showError(err); resetBtn(); })
        .autoDraftForSubject(subject, totalCount, difficulty, additionalInstructions);
    } else {
      var config = {
        subject: subject,
        strand: document.getElementById('strand').value,
        count: Number(document.getElementById('count').value) || 5,
        difficulty: difficulty,
        additionalInstructions: additionalInstructions
      };
      google.script.run
        .withSuccessHandler(function (res) { onDrafted(res); resetBtn(); })
        .withFailureHandler(function (err) { showError(err); resetBtn(); })
        .draftQuestions(config);
    }
  }

  function resetBtn() {
    var btn = document.getElementById('draftBtn');
    btn.disabled = false;
    btn.textContent = 'Draft Questions';
  }

  function showError(err) {
    document.getElementById('loadingLine').style.display = 'none';
    document.getElementById('status').innerHTML = '<div class="status status-error">' + (err.message || err) + '</div>';
  }

  function onDrafted(questions) {
    renderReview(questions || [], []);
  }

  function onAutoDrafted(subject, res) {
    res = res || {};
    renderReview(res.drafted || [], res.errors || []);
  }

  function renderReview(questions, errors) {
    drafted = questions;
    document.getElementById('reviewCard').style.display = 'block';
    document.getElementById('reviewErrors').innerHTML = errors.length
      ? '<div class="status status-error">Some strands failed to draft: ' +
          errors.map(function (e) { return e.strand + ' (' + e.message + ')'; }).join('; ') + '</div>'
      : '';
    document.getElementById('reviewList').innerHTML = questions.map(function (q, i) {
      return '<div class="card">' +
        '<label><input type="checkbox" class="include-box" data-index="' + i + '" checked /> Include' +
          (q.strand ? ' <span class="pill pill-good">' + escapeHtml(q.strand) + '</span>' : '') + '</label>' +
        '<label>Question</label><textarea rows="3" data-field="question_text" data-index="' + i + '">' + escapeHtml(q.question_text) + '</textarea>' +
        '<div class="row">' +
          '<div><label>Marks</label><input type="number" data-field="marks" data-index="' + i + '" value="' + q.marks + '" min="1" /></div>' +
          '<div><label>Difficulty</label><input type="number" data-field="difficulty" data-index="' + i + '" value="' + q.difficulty + '" min="1" max="3" /></div>' +
        '</div>' +
        '<label>Sub-skill</label><input type="text" data-field="sub_skill" data-index="' + i + '" value="' + escapeAttr(q.sub_skill) + '" />' +
        '<label>Answer</label><textarea rows="2" data-field="answer_text" data-index="' + i + '">' + escapeHtml(q.answer_text) + '</textarea>' +
        '<label>Marking notes</label><textarea rows="2" data-field="marking_notes" data-index="' + i + '">' + escapeHtml(q.marking_notes) + '</textarea>' +
        '</div>';
    }).join('') || '<div class="muted">Nothing drafted.</div>';
    document.getElementById('reviewCard').scrollIntoView({ behavior: 'smooth' });
  }

  function collectApproved() {
    document.querySelectorAll('[data-field]').forEach(function (el) {
      var i = Number(el.dataset.index);
      var field = el.dataset.field;
      var value = (field === 'marks' || field === 'difficulty') ? Number(el.value) : el.value;
      drafted[i][field] = value;
    });
    var approved = [];
    document.querySelectorAll('.include-box').forEach(function (cb) {
      if (cb.checked) approved.push(drafted[Number(cb.dataset.index)]);
    });
    return approved;
  }

  function saveSelected() {
    var subject = document.getElementById('subject').value;
    var approved = collectApproved();
    if (!approved.length) { document.getElementById('saveStatus').innerHTML = '<div class="status status-error">Nothing selected.</div>'; return; }

    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Saving…';

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = 'Save Selected to Question Bank';
        document.getElementById('saveStatus').innerHTML = '<div class="status status-ok">Saved ' + res.inserted + ' question(s): ' + res.ids.join(', ') + '</div>';
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Save Selected to Question Bank';
        document.getElementById('saveStatus').innerHTML = '<div class="status status-error">' + (err.message || err) + '</div>';
      })
      .saveDraftedQuestions(subject, approved);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return (str || '').replace(/"/g, '&quot;');
  }
</script>
